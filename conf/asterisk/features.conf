[general]

[applicationmap]
; *86 pressed by the CALLED party during a bridged call: block the caller.
; The Gosub (sub-block-caller, in the general dialplan) adds the caller's
; number to the inbound blacklist, redirects the CALLER's channel to the
; not-in-service announcement, and hangs up. Only the callee can trigger
; it — the caller's side pressing *86 does nothing.
blockcaller => *86,callee,Gosub(sub-block-caller,s,1)
